<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Fills tall phones up to 20:9; wider screens (desktop, tablets) get side bars at 9:16. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 20 / 9));
        background: #231F20; display: block; outline: none; touch-action: none; }
      @supports (height: 100dvh) {
        #unity-canvas { width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 20 / 9)); }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="450" height="800" tabindex="-1"></canvas>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).catch(function (message) { console.error(message); });
    </script>
  </body>
</html>
